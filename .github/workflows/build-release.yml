name: Release

on:
  push:
    tags:
      - v*

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate release tag and package version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $tag (expected vX.Y.Z)" >&2
            exit 1
          fi
          if [[ "${tag#v}" != "$version" ]]; then
            echo "Tag $tag does not match package.json version $version" >&2
            exit 1
          fi

      - name: Extract latest CHANGELOG entry
        id: changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          CHANGELOG_CONTENT=$(awk -v version="$version" '
            BEGIN {
              header = "## [" version "]";
              found = 0;
            }
            index($0, header) == 1 {
              found = 1;
            }
            found && /^## \[/ && index($0, header) != 1 {
              exit;
            }
            found {
              print;
            }
          ' CHANGELOG.md)
          if [ -z "$CHANGELOG_CONTENT" ]; then
            echo "No CHANGELOG.md entry found for ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          {
            echo "content<<EOF"
            printf '%s\n' "$CHANGELOG_CONTENT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        uses: actions/github-script@v7
        env:
          CHANGELOG_CONTENT: ${{ steps.changelog.outputs.content }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const body = process.env.CHANGELOG_CONTENT || `Release ${tag}`;

            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag,
              });

              const updated = await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: existing.data.id,
                tag_name: tag,
                name: tag,
                body: body,
                draft: false,
                prerelease: false,
              });

              console.log(`Updated release ${updated.data.html_url}`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              const release = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: tag,
                body: body,
                draft: false,
                prerelease: false,
              });

              console.log(`Created release ${release.data.html_url}`);
            }
