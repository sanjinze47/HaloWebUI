name: Python CI

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'backend/**'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'backend/**'
      - 'pyproject.toml'
      - 'uv.lock'

jobs:
  build:
    name: 'Backend Format and Tests'
    runs-on: ubuntu-latest
    env:
      DATA_DIR: ${{ runner.temp }}/halowebui-pytest-data
      PYTHONPATH: backend

    strategy:
      matrix:
        python-version:
          - 3.11.x
          - 3.12.x

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python-version }}'
          cache: pip
          cache-dependency-path: 'backend/requirements/*.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements/full.txt -r backend/requirements/dev-test.txt

      - name: Check backend formatting
        run: black --check backend

      - name: Run backend unit tests
        run: |
          mkdir -p "$DATA_DIR"
          python -m pytest -q backend/open_webui/test/unit

      - name: Compile backend
        run: python -m compileall -q backend/open_webui
