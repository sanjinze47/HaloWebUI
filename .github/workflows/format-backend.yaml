name: Python CI

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'backend/**'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'backend/**'
      - 'pyproject.toml'
      - 'uv.lock'

jobs:
  build:
    name: 'Backend Format and Tests'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend

    strategy:
      matrix:
        python-version:
          - 3.11.x
          - 3.12.x

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python-version }}'
          cache: pip
          cache-dependency-path: 'backend/requirements/*.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements/full.txt -r backend/requirements/dev-test.txt

      - name: Check backend formatting
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          mapfile -t changed_python < <(
            git diff --diff-filter=ACMR --name-only "$BASE_SHA" "$GITHUB_SHA" |
              grep -E '^backend/.*\.py$' || true
          )
          if (( ${#changed_python[@]} == 0 )); then
            echo "No changed backend Python files to format-check."
            exit 0
          fi
          black --check "${changed_python[@]}"

      - name: Run backend unit tests
        env:
          DATA_DIR: ${{ runner.temp }}/halowebui-pytest-data
        run: |
          mkdir -p "$DATA_DIR"
          python -m pytest -q backend/open_webui/test/unit

      - name: Compile backend
        run: python -m compileall -q backend/open_webui
