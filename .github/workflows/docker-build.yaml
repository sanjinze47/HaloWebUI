name: Create and publish Docker images with specific build args

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: Optional X.Y.Z stable version to retry from source_ref vX.Y.Z
        required: false
        type: string
      source_ref:
        description: Required matching vX.Y.Z tag for a stable-version retry
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - v*
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/workflows/*.disabled'

env:
  REGISTRY: ghcr.io

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate manual edge source
        if: github.event_name == 'workflow_dispatch' && inputs.version_tag == ''
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" || -n "$SOURCE_REF" ]]; then
            echo "Manual edge rebuilds must run from main without source_ref." >&2
            exit 1
          fi

      - name: Validate tag against package version
        if: startsWith(github.ref, 'refs/tags/') || inputs.version_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.version_tag || github.ref_name }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG#v}"
          version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').version")"
          lock_root_version="$(node -p "require('./package-lock.json').packages[''].version")"
          if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $tag (expected X.Y.Z)" >&2
            exit 1
          fi
          if [[ "$tag" != "$version" ]]; then
            echo "Tag $tag does not match package.json version $version" >&2
            exit 1
          fi
          if [[ "$version" != "$lock_version" || "$version" != "$lock_root_version" ]]; then
            echo "package-lock.json versions do not match package.json version $version" >&2
            exit 1
          fi
          if ! grep -Fq "## [$version] - " CHANGELOG.md; then
            echo "CHANGELOG.md has no dated release section for $version" >&2
            exit 1
          fi
          expected_ref="v$tag"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$SOURCE_REF" != "$expected_ref" ]]; then
            echo "Stable retries must use source_ref $expected_ref" >&2
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "$expected_ref")"
          source_commit="$(git rev-parse HEAD)"
          if [[ -z "$tag_commit" || "$tag_commit" != "$source_commit" ]]; then
            echo "Checked out source is not the exact $expected_ref commit" >&2
            exit 1
          fi

  build-main-image:
    needs: validate-version
    if: always() && needs.validate-version.result == 'success'
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64

    steps:
      # GitHub Packages requires the entire repository name to be in lowercase
      # although the repository owner has a lowercase username, this prevents some people from running actions after forking
      - name: Set repository and image name to lowercase
        run: |
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >>${GITHUB_ENV}
          echo "FULL_IMAGE_NAME=ghcr.io/${IMAGE_NAME,,}" >>${GITHUB_ENV}
        env:
          IMAGE_NAME: '${{ github.repository }}'

      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read application version
        run: |
          version="$(node -p 'require("./package.json").version')"
          echo "WEBUI_VERSION=$version" >> "$GITHUB_ENV"
          echo "WEBUI_BUILD_HASH=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Normalize manual version tag
        if: inputs.version_tag != ''
        shell: bash
        run: echo "IMAGE_VERSION_TAG=${INPUT_VERSION_TAG#v}" >> "$GITHUB_ENV"
        env:
          INPUT_VERSION_TAG: ${{ inputs.version_tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata for full image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FULL_IMAGE_NAME }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' && inputs.version_tag == '' }}
            type=sha,prefix=git-
            type=semver,pattern={{version}}
            type=raw,value=${{ env.IMAGE_VERSION_TAG }},enable=${{ inputs.version_tag != '' }}
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') || inputs.version_tag != '' }}

      - name: Build full Docker image
        uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          outputs: type=image,name=${{ env.FULL_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.FULL_IMAGE_NAME }}:cache-main-${{ env.PLATFORM_PAIR }}
          cache-to: type=registry,ref=${{ env.FULL_IMAGE_NAME }}:cache-main-${{ env.PLATFORM_PAIR }},mode=max
          build-args: |
            WEBUI_VERSION=${{ env.WEBUI_VERSION }}
            WEBUI_BUILD_HASH=${{ env.WEBUI_BUILD_HASH }}
            HALO_RUNTIME_PROFILE=main

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-main-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-main-images:
    runs-on: ubuntu-latest
    needs: [validate-version, build-main-image]
    if: always() && needs.validate-version.result == 'success' && needs.build-main-image.result == 'success'
    permissions:
      contents: read
      packages: write
    steps:
      # GitHub Packages requires the entire repository name to be in lowercase
      # although the repository owner has a lowercase username, this prevents some people from running actions after forking
      - name: Set repository and image name to lowercase
        run: |
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >>${GITHUB_ENV}
          echo "FULL_IMAGE_NAME=ghcr.io/${IMAGE_NAME,,}" >>${GITHUB_ENV}
        env:
          IMAGE_NAME: '${{ github.repository }}'

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read application version
        run: |
          version="$(node -p 'require("./package.json").version')"
          echo "WEBUI_VERSION=$version" >> "$GITHUB_ENV"

      - name: Normalize manual version tag
        if: inputs.version_tag != ''
        shell: bash
        run: echo "IMAGE_VERSION_TAG=${INPUT_VERSION_TAG#v}" >> "$GITHUB_ENV"
        env:
          INPUT_VERSION_TAG: ${{ inputs.version_tag }}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-main-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata for full image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FULL_IMAGE_NAME }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' && inputs.version_tag == '' }}
            type=sha,prefix=git-
            type=semver,pattern={{version}}
            type=raw,value=${{ env.IMAGE_VERSION_TAG }},enable=${{ inputs.version_tag != '' }}
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') || inputs.version_tag != '' }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.FULL_IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.FULL_IMAGE_NAME }}:${{ steps.meta.outputs.version }}

  build-slim-image:
    needs: validate-version
    if: always() && needs.validate-version.result == 'success'
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64

    steps:
      - name: Set repository and image name to lowercase
        run: |
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >>${GITHUB_ENV}
          echo "FULL_IMAGE_NAME=ghcr.io/${IMAGE_NAME,,}" >>${GITHUB_ENV}
        env:
          IMAGE_NAME: '${{ github.repository }}'

      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read application version
        run: |
          version="$(node -p 'require("./package.json").version')"
          echo "WEBUI_VERSION=$version" >> "$GITHUB_ENV"
          echo "WEBUI_BUILD_HASH=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Normalize manual version tag
        if: inputs.version_tag != ''
        shell: bash
        run: echo "IMAGE_VERSION_TAG=${INPUT_VERSION_TAG#v}" >> "$GITHUB_ENV"
        env:
          INPUT_VERSION_TAG: ${{ inputs.version_tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata for Docker images (slim tag)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FULL_IMAGE_NAME }}
          tags: |
            type=raw,value=edge-slim,enable=${{ github.ref == 'refs/heads/main' && inputs.version_tag == '' }}
            type=raw,value=slim,enable=${{ startsWith(github.ref, 'refs/tags/v') || inputs.version_tag != '' }}
            type=sha,prefix=git-,suffix=-slim
            type=semver,pattern={{version}}-slim
            type=raw,value=${{ env.IMAGE_VERSION_TAG }}-slim,enable=${{ inputs.version_tag != '' }}

      - name: Build Docker image (slim)
        uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          outputs: type=image,name=${{ env.FULL_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.FULL_IMAGE_NAME }}:cache-slim-${{ env.PLATFORM_PAIR }}
          cache-to: type=registry,ref=${{ env.FULL_IMAGE_NAME }}:cache-slim-${{ env.PLATFORM_PAIR }},mode=max
          build-args: |
            WEBUI_VERSION=${{ env.WEBUI_VERSION }}
            WEBUI_BUILD_HASH=${{ env.WEBUI_BUILD_HASH }}
            HALO_RUNTIME_PROFILE=slim

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-slim-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-slim-images:
    runs-on: ubuntu-latest
    needs: [validate-version, build-slim-image]
    if: always() && needs.validate-version.result == 'success' && needs.build-slim-image.result == 'success'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set repository and image name to lowercase
        run: |
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >>${GITHUB_ENV}
          echo "FULL_IMAGE_NAME=ghcr.io/${IMAGE_NAME,,}" >>${GITHUB_ENV}
        env:
          IMAGE_NAME: '${{ github.repository }}'

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read application version
        run: |
          version="$(node -p 'require("./package.json").version')"
          echo "WEBUI_VERSION=$version" >> "$GITHUB_ENV"

      - name: Normalize manual version tag
        if: inputs.version_tag != ''
        shell: bash
        run: echo "IMAGE_VERSION_TAG=${INPUT_VERSION_TAG#v}" >> "$GITHUB_ENV"
        env:
          INPUT_VERSION_TAG: ${{ inputs.version_tag }}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-slim-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata for Docker images (slim tag)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FULL_IMAGE_NAME }}
          tags: |
            type=raw,value=edge-slim,enable=${{ github.ref == 'refs/heads/main' && inputs.version_tag == '' }}
            type=raw,value=slim,enable=${{ startsWith(github.ref, 'refs/tags/v') || inputs.version_tag != '' }}
            type=sha,prefix=git-,suffix=-slim
            type=semver,pattern={{version}}-slim
            type=raw,value=${{ env.IMAGE_VERSION_TAG }}-slim,enable=${{ inputs.version_tag != '' }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.FULL_IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.FULL_IMAGE_NAME }}:${{ steps.meta.outputs.version }}
